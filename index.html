<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Register POS</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%A7%BE%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700;900&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#eef0f3;--card:#fff;--ink:#16181d;--mute:#6b7280;--line:#e3e6ea;--blue:#1560f0;--red:#e5484d;--shadow:0 1px 2px rgba(0,0,0,.06);
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e1013;--card:#1a1d23;--ink:#f1f3f6;--mute:#98a1ae;--line:#2a2e36}}
:root[data-theme="dark"]{--bg:#0e1013;--card:#1a1d23;--ink:#f1f3f6;--mute:#98a1ae;--line:#2a2e36}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font:15px/1.35 "Inter","Segoe UI",system-ui,sans-serif}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
button:focus-visible,input:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
.app{display:grid;grid-template-columns:1fr 340px;height:100%;gap:14px;padding:14px}
.main,.ticket{background:var(--card);border-radius:14px;box-shadow:var(--shadow);display:flex;flex-direction:column;min-height:0}
.top{display:flex;align-items:center;gap:10px;padding:14px 18px 8px}
.top h1{font-size:20px;margin:0;flex:1;font-weight:650}
.top input{border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:8px;padding:8px 12px;width:200px}
.body{flex:1;overflow:auto;padding:8px 18px 14px}
.cats{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:10px;margin-bottom:14px}
.cat{border-radius:8px;color:#fff;padding:12px;text-align:left;min-height:66px;font-weight:650;display:flex;flex-direction:column;justify-content:space-between}
.cat small{font-weight:400;opacity:.9}
.cat.on{outline:3px solid var(--ink);outline-offset:1px}
.items{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px}
.item{border-radius:8px;overflow:hidden;background:var(--bg);text-align:left;border:1px solid var(--line);display:flex;flex-direction:column}
.item:active{transform:scale(.97)}
.pic{height:74px;display:grid;place-items:center;font-size:30px;font-weight:700;color:#fff}
.item b{padding:8px 10px 0;font-weight:600}
.item span{padding:0 10px 9px;color:var(--mute);font-size:13px}
.nav{display:flex;border-top:1px solid var(--line);padding:6px 10px}
.nav button{flex:1;padding:10px;color:var(--mute);font-weight:550}
.nav button.on{color:var(--blue)}
.tk-head{display:flex;justify-content:space-between;align-items:center;padding:14px 16px 6px;font-weight:650;font-size:17px}
.tabs{display:flex;gap:16px;padding:0 16px;border-bottom:1px solid var(--line)}
.tabs button{padding:8px 0;color:var(--mute);border-bottom:2px solid transparent}
.tabs button.on{color:var(--ink);border-color:var(--ink);font-weight:600}
.lines{flex:1;overflow:auto;padding:6px 16px}
.line{display:flex;align-items:center;gap:8px;padding:10px 0;border-bottom:1px solid var(--line)}
.line .n{flex:1}
.q{display:flex;align-items:center;gap:2px}
.q button{width:26px;height:26px;border-radius:50%;background:var(--bg);border:1px solid var(--line)}
.q span{min-width:22px;text-align:center}
.empty{color:var(--mute);text-align:center;padding:40px 10px}
.sum{border-top:1px solid var(--line);padding:10px 16px;display:grid;gap:4px}
.sum div{display:flex;justify-content:space-between}
.sum .t{font-weight:700;font-size:17px;margin-top:4px}
.pay{margin:4px 16px 16px;background:var(--blue);color:#fff;border-radius:8px;padding:14px;font-weight:650;font-size:16px}
.pay:disabled{opacity:.4;cursor:not-allowed}
.ghost{border:1px solid var(--line);border-radius:8px;padding:7px 11px}
.row{display:flex;gap:8px;padding:0 16px 8px}
.row .ghost{flex:1}
.ghost.on{background:var(--ink);color:var(--card)}
.ord{border:1px solid var(--line);border-radius:8px;padding:12px;margin-bottom:10px}
.ord div{display:flex;justify-content:space-between}
.ord p{margin:4px 0 0;color:var(--mute);font-size:13px}
dialog{border:0;border-radius:14px;padding:22px;width:min(360px,92vw);background:var(--card);color:var(--ink)}
dialog::backdrop{background:rgba(0,0,0,.5)}
dialog h2{margin:0 0 4px}
.seg{display:flex;gap:8px;margin:14px 0}
.seg button{flex:1;border:1px solid var(--line);border-radius:8px;padding:10px}
.seg button.on{background:var(--blue);color:#fff;border-color:var(--blue)}
dialog input{width:100%;padding:10px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);font-size:18px}
.chg{margin:10px 0;color:var(--mute)}
.chg b{color:var(--ink)}
.quick{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap}
.acts{display:flex;gap:8px;margin-top:16px}
.acts button{flex:1;padding:12px;border-radius:8px;border:1px solid var(--line)}
.acts .go{background:var(--blue);color:#fff;border-color:var(--blue);font-weight:650}
.acts .go:disabled{opacity:.4}
.hide{display:none}
@media (max-width:820px){.app{grid-template-columns:1fr;grid-template-rows:1fr 46vh}}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.chips button,.chips select{border:1px solid var(--line);border-radius:999px;padding:7px 13px;background:var(--card);color:var(--ink);font:inherit}
.chips button.on{background:var(--ink);color:var(--card)}
.fm{display:flex;gap:8px;flex-wrap:wrap;align-items:end;margin-bottom:14px}
.fm label{display:grid;gap:3px;font-size:12px;color:var(--mute)}
.fm input,.fm select{padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);font:14px inherit}
.fm button{background:var(--blue);color:#fff;border-radius:8px;padding:9px 14px;font-weight:600}
table{width:100%;border-collapse:collapse;font-size:14px;margin-bottom:12px}
th,td{text-align:left;padding:8px 6px;border-bottom:1px solid var(--line)}
th{color:var(--mute);font-weight:500}
.r{text-align:right}
.low{color:var(--red);font-weight:600}
.x{color:var(--red);padding:2px 8px}
.ord[data-o]{cursor:pointer}
.rc{background:#fff;color:#111;font:12px/1.5 ui-monospace,Menlo,monospace;padding:14px;margin:auto;border:1px solid var(--line)}
.rc h3{margin:0;text-align:center;font-size:15px}
.rc p{margin:0;text-align:center}
.rc .l{display:flex;justify-content:space-between;gap:8px}
.rc hr{border:0;border-top:1px dashed #999;margin:6px 0}
#rdlg{width:auto}
@media print{body>*:not(#rdlg){display:none!important}#rdlg .btns{display:none}}
.cats{display:flex;flex-wrap:wrap;gap:6px}
.cat{min-height:0;padding:6px 12px;border-radius:6px;flex-direction:row;font-size:13px;font-weight:600}
.cat small{display:none}
.items{grid-template-columns:repeat(auto-fill,minmax(112px,1fr))}
.item{aspect-ratio:1/1}
.item b{font-size:13px}
.pic{flex:1;height:auto;min-height:0}
.tg{display:grid;grid-template-columns:repeat(auto-fill,minmax(84px,1fr));gap:8px;margin-top:10px}
.tg button{aspect-ratio:1;border:1px solid var(--line);border-radius:8px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-weight:650}
.tg small{font-weight:400;color:var(--mute)}
.tg .sel{border:2px solid var(--blue)}
.tg .occ{background:var(--red);color:#fff}.tg .occ small{color:#fff}
.ord[data-h]{cursor:pointer}
.bar{height:8px;border-radius:4px;background:var(--bg);min-width:80px}.bar i{display:block;height:100%;border-radius:4px}
/* ---- refreshed look ---- */
:root{--bg:#e8eeed;--card:#fff;--ink:#12211f;--mute:#60716e;--line:#d9e3e1;--blue:#0b7a6c;--acc:#f0a23b;--red:#d9463f;--shadow:0 1px 2px rgba(16,40,36,.06),0 10px 28px -14px rgba(16,40,36,.2)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0d1514;--card:#16201f;--ink:#eaf2f0;--mute:#8fa5a1;--line:#24332f;--blue:#19a894}}
:root[data-theme="dark"]{--bg:#0d1514;--card:#16201f;--ink:#eaf2f0;--mute:#8fa5a1;--line:#24332f;--blue:#19a894}
@keyframes fade{from{opacity:0}}
@keyframes pop{from{opacity:0;transform:translateY(8px) scale(.97)}}
@keyframes slide{from{opacity:0;transform:translateX(24px)}}
@keyframes ring{0%{box-shadow:0 0 0 0 rgba(240,162,59,.65)}100%{box-shadow:0 0 0 10px rgba(240,162,59,0)}}
body{font-family:"Manrope","Segoe UI",system-ui,sans-serif}
.main,.ticket{border-radius:20px}
.top h1{font-size:23px;font-weight:800;letter-spacing:-.02em}
.top input{border-radius:999px;padding:9px 16px}
.top input,.fm input,.fm select,dialog input{transition:border-color .15s,box-shadow .15s}
.top input:focus,.fm input:focus,.fm select:focus,dialog input:focus{outline:0;border-color:var(--blue);box-shadow:0 0 0 3px color-mix(in srgb,var(--blue) 22%,transparent)}
.body>*{animation:fade .2s ease}
.cat{border-radius:999px;padding:7px 14px;transition:transform .12s,filter .12s}
.cat:hover{filter:brightness(1.07)}.cat:active{transform:scale(.96)}
.item{border-radius:16px;background:var(--card);transition:transform .14s,box-shadow .14s,border-color .14s}
.item:hover{box-shadow:0 10px 20px -12px rgba(10,40,36,.4);border-color:var(--blue)}
.item b{font-weight:700}.item span{font-weight:650;color:var(--blue)}
.pic{position:relative;isolation:isolate;font-size:38px}
.pic::before{content:"";position:absolute;inset:0;z-index:-1;background:linear-gradient(160deg,rgba(255,255,255,.3),rgba(0,0,0,.14))}
.nav{gap:6px}
.nav button{border-radius:12px;transition:background .15s,color .15s}
.nav button.on{background:color-mix(in srgb,var(--blue) 12%,transparent);color:var(--blue);font-weight:750}
.pay{border-radius:14px;background:linear-gradient(135deg,var(--blue),#12a08b);box-shadow:0 10px 20px -10px var(--blue);transition:transform .12s}
.pay:not(:disabled):active{transform:scale(.98)}
.ghost{border-radius:10px;transition:background .12s,transform .12s}
.ghost:active{transform:scale(.97)}
.ghost.on{background:var(--blue);color:#fff;border-color:var(--blue)}
.ghost:disabled{opacity:.45;cursor:not-allowed}
dialog{border-radius:20px;box-shadow:0 30px 60px -20px rgba(0,0,0,.5)}
dialog[open]{animation:pop .22s cubic-bezier(.2,.8,.2,1)}
dialog[open]::backdrop{animation:fade .2s;backdrop-filter:blur(2px)}
dialog .fm{display:grid;gap:10px}
dialog select{width:100%}
tr:hover td{background:color-mix(in srgb,var(--blue) 6%,transparent)}
.mini{border:1px solid var(--line);border-radius:8px;padding:4px 10px;font-size:13px;margin-left:4px;transition:background .12s}
.mini:hover{background:var(--bg)}.mini.dg{color:var(--red)}
.card2{border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:14px}
.card2 p{margin:4px 0 10px}
.qrc{display:flex;gap:18px;flex-wrap:wrap;align-items:flex-start}
.qrb{background:#fff;padding:10px;border-radius:14px;line-height:0;min-width:188px;min-height:188px;display:grid;place-items:center}
.qrb .chg{line-height:1.4;font-size:13px;text-align:center}
.qri{flex:1;min-width:220px}
.url{font:600 13px ui-monospace,Menlo,monospace;word-break:break-all;background:var(--bg);padding:8px 10px;border-radius:8px}
.okc{color:#0a8f5b;font-weight:650}.warn{color:#b45309;font-weight:650}
.bdg{display:inline-grid;place-items:center;min-width:18px;height:18px;padding:0 5px;margin-left:6px;border-radius:9px;background:var(--acc);color:#1a1200;font-size:11px;font-weight:800;animation:ring 1.4s infinite}
.bdg.hide{display:none}
#pop{position:fixed;top:calc(14px + env(safe-area-inset-top,0px));right:14px;z-index:50;width:min(340px,calc(100vw - 28px));display:grid;gap:10px;max-height:calc(100% - 28px);overflow:auto}
#pop.hide{display:none}
#pop .pc{background:#fff!important;box-shadow:0 18px 40px -10px rgba(0,0,0,.35),0 0 0 1px rgba(0,0,0,.08)!important;-webkit-backdrop-filter:none!important;backdrop-filter:none!important}@media(prefers-color-scheme:dark){#pop .pc{background:#2c2c2e!important}}
.pc{background:var(--card);border:1px solid var(--line);border-left:5px solid var(--acc);border-radius:14px;padding:12px 14px;box-shadow:0 18px 40px -16px rgba(0,0,0,.45);animation:slide .28s cubic-bezier(.2,.8,.2,1)}
.pc p{margin:4px 0}.pc ul{margin:6px 0;padding-left:18px}.pc .ph{display:flex;justify-content:space-between}
.tst{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:var(--card);padding:10px 16px;border-radius:999px;font-weight:600;z-index:60;animation:pop .2s}
.cr{display:flex;gap:8px;align-items:center;width:100%;text-align:left;padding:9px 10px;border-radius:10px;border:1px solid var(--line);margin-top:6px}
.cr span{flex:1;color:var(--mute)}.cr em{font-style:normal;color:var(--blue);font-weight:700}.cr:hover{background:var(--bg)}
#cl{max-height:220px;overflow:auto;margin:6px 0 10px}
details.nc{margin:8px 0}details.nc summary{cursor:pointer;font-weight:650;padding:6px 0}
.qrp{text-align:center}.qrp .qrb{margin:12px auto}
@media print{body>#pk.qpn{display:block!important}#pk .acts{display:none}}
/* ---- customer ordering page ---- */
body:not(.cm) #cm{display:none}
body.cm .app{display:none}
#cm{min-height:100%;background:var(--bg)}
.cmw{max-width:560px;margin:0 auto;padding:16px 16px 110px}
.cmh{display:flex;gap:12px;align-items:center;padding:8px 0 10px}
.cmh>span{font-size:32px;width:56px;height:56px;display:grid;place-items:center;background:var(--card);border-radius:16px;box-shadow:var(--shadow)}
.cmh h1{margin:0;font-size:22px;font-weight:800;letter-spacing:-.02em}
.cmh p{margin:2px 0 0;color:var(--mute);font-size:13px}
.cmc{display:flex;gap:6px;overflow-x:auto;padding:6px 0 8px;position:sticky;top:0;background:var(--bg);z-index:5}
.cmc button{flex:none;border:1px solid var(--line);background:var(--card);border-radius:999px;padding:8px 14px;font-weight:600}
.cmc button.on{background:var(--blue);color:#fff;border-color:var(--blue)}
.cml{display:grid;gap:8px;margin-top:6px}
.cmr{display:flex;align-items:center;gap:12px;background:var(--card);border-radius:16px;padding:10px 12px;box-shadow:var(--shadow)}
.cmr .ic{font-size:26px;width:46px;height:46px;display:grid;place-items:center;background:var(--bg);border-radius:12px}
.cmr .nm{flex:1;display:grid}.cmr .nm span{color:var(--blue);font-weight:700}
.cmr em{font-style:normal;color:var(--mute);font-size:13px}
.cmr .add{background:var(--blue);color:#fff;border-radius:999px;padding:8px 18px;font-weight:700;transition:transform .12s}
.cmr .add:active{transform:scale(.94)}
.cmr .q button{width:32px;height:32px}
.cmbar{position:fixed;left:16px;right:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));max-width:528px;margin:0 auto;background:var(--blue);color:#fff;border-radius:16px;padding:16px;font-weight:750;font-size:16px;box-shadow:0 14px 30px -12px var(--blue);animation:pop .22s}
.cmbar.static{position:static;width:100%;margin-top:6px;max-width:none;box-shadow:none;animation:none}
.cmbar:disabled{opacity:.6}
.cmw form{display:grid;gap:12px}
.cmw label{display:grid;gap:4px;font-weight:650;font-size:14px}
.cmw input,.cmw textarea{padding:12px;border:1px solid var(--line);border-radius:12px;background:var(--card);color:var(--ink);font:inherit;font-size:16px}
.cmw input:focus,.cmw textarea:focus{outline:0;border-color:var(--blue);box-shadow:0 0 0 3px color-mix(in srgb,var(--blue) 22%,transparent)}
.cmw .er{color:var(--red);font-size:13px;font-weight:600}
.cmw .sm{background:var(--card);border-radius:14px;padding:12px;display:grid;gap:4px}
.cmw .sm div{display:flex;justify-content:space-between}
form.cmw{display:grid;gap:12px}.cmt{margin:6px 0 0;font-size:24px;font-weight:800}.cmg{margin:18px 0 6px;font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--mute)}.cmw .cml{margin-top:0}
.back{color:var(--blue);font-weight:650;padding:8px 0}
.done{text-align:center;padding-top:60px}
.tick{width:72px;height:72px;margin:0 auto 14px;border-radius:50%;background:var(--blue);color:#fff;font-size:36px;display:grid;place-items:center;animation:pop .3s}
.tick.wait{background:var(--acc);color:#1a1200}.tick.no{background:var(--red)}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}

.top{flex-wrap:wrap;row-gap:8px}
#topCust,#who{white-space:nowrap}
#who{margin-left:auto;font-weight:650}
.loginbox{width:min(320px,80vw)}
.loginbox h2{margin:0 0 4px}
.loginbox .fm{display:grid;gap:10px;margin-top:14px}
.loginbox .err{color:var(--red);font-size:13px;min-height:16px}
.ord.voided{opacity:.55}
.ord.voided b{text-decoration:line-through}
.ord .mini{margin-top:8px}
#login::backdrop{background:rgba(0,0,0,.65)}

/* ---- v3: product tiles, squarer controls, light motion ---- */
:root{--r:5px}
/* 80%-square controls: small corner radius on every button / tab */
.cat,.ghost,.pay,.nav button,.tabs button,.chips button,.chips select,.seg button,.acts button,.mini,.cmc button,.cmr .add,.cmbar,.q button,.fm button,.back,.top input,.quick button,.tg button,.cr{border-radius:var(--r)!important}
.q button{width:28px;height:28px}
.cat{padding:8px 14px}
.chips button{padding:8px 14px}
/* tabs: boxed, squared tabs with animated active state */
.tabs{gap:4px;padding:8px 16px 0}
.tabs button{padding:8px 16px;border:1px solid var(--line);border-bottom:0;border-radius:var(--r) var(--r) 0 0!important;background:var(--bg);color:var(--mute);margin-bottom:-1px;transition:background .18s,color .18s,transform .12s}
.tabs button:hover{color:var(--ink)}
.tabs button.on{background:var(--card);color:var(--blue);border-color:var(--line);box-shadow:inset 0 2px 0 var(--blue);font-weight:700}
.chips button{transition:background .18s,color .18s,transform .12s}
.chips button:active,.tabs button:active,.nav button:active,.seg button:active{transform:scale(.96)}
.nav button{position:relative}
.nav button::after{content:"";position:absolute;left:30%;right:30%;bottom:2px;height:2px;background:var(--blue);transform:scaleX(0);transition:transform .2s}
.nav button.on::after{transform:scaleX(1)}
.ghost:hover,.acts button:hover,.seg button:hover{background:color-mix(in srgb,var(--blue) 8%,var(--card))}
.ghost.on:hover{background:var(--blue)}
.pay:not(:disabled):hover{filter:brightness(1.06);transform:translateY(-1px)}
/* product tiles */
.items{grid-template-columns:repeat(auto-fill,minmax(128px,1fr));gap:12px}
.item{position:relative;aspect-ratio:auto;min-height:138px;padding:0;border-radius:var(--r)!important;border:1px solid var(--line);border-top:4px solid var(--c);background:var(--card);overflow:hidden;box-shadow:0 1px 2px rgba(16,40,36,.05);transition:transform .16s cubic-bezier(.2,.8,.2,1),box-shadow .16s,border-color .16s}
.item:hover{transform:translateY(-3px);box-shadow:0 12px 22px -12px var(--c);border-color:var(--c)}
.item:active{transform:scale(.96)}
.item .pic{flex:none;height:auto;min-height:0;margin:12px 0 0 12px;width:38px;height:38px;border-radius:var(--r);background:color-mix(in srgb,var(--c) 16%,transparent)!important;color:var(--c);font-size:20px;font-weight:800;transition:transform .2s}
.item .pic::before{display:none}
.item:hover .pic{transform:rotate(-6deg) scale(1.08)}
.item b{padding:10px 12px 0;font-size:13.5px;line-height:1.25;flex:1}
.item .pr{display:inline-block;align-self:flex-start;margin:8px 12px 12px;padding:3px 8px;border-radius:var(--r);background:var(--bg);color:var(--ink);font-size:12.5px;font-weight:750}
.item .plus{position:absolute;right:8px;bottom:8px;width:26px;height:26px;display:grid;place-items:center;border-radius:var(--r);background:var(--c);color:#fff;font-style:normal;font-weight:700;font-size:17px;line-height:1;opacity:0;transform:scale(.6) rotate(-90deg);transition:opacity .16s,transform .2s}

<body>
<div class="app">
  <section class="main">
    <div class="top"><h1 id="title">Menu</h1><input id="q" type="search" placeholder="Search items" aria-label="Search items"><button class="ghost" id="topCust">+ Customer</button><button class="ghost" id="qrst">⚪ QR orders</button><button class="ghost" id="who"></button></div>
    <div class="body" id="body"></div>
    <nav class="nav"><button id="nMenu" class="on">Menu</button><button id="nOrd">Orders<span id="bdg" class="bdg hide">0</span></button><button id="nMng">Manage</button></nav>
  </section>
  <aside class="ticket">
    <div class="tk-head"><span id="tno">#1</span><button class="ghost" id="clear">Clear</button></div>
    <div class="tabs"><button class="on">Check</button><button data-t="a">Guest</button></div>
    <div class="lines" id="lines"></div>
    <div class="row"><button class="ghost" id="disc">10% discount</button><button class="ghost" id="dine">Dine in</button></div>
    <div class="row"><button class="ghost" id="custBtn">Add customer</button><button class="ghost" id="redBtn">Use points</button></div>
    <div class="row"><button class="ghost" id="tbl">Table</button><button class="ghost" id="hold">Hold</button><button class="ghost" id="held">Held (0)</button></div>

    <header class="mgh"><button class="ghost" id="mgBack">← Back to POS</button><h1>Manage</h1><span class="sp"></span><span id="mgSite"></span><button class="ghost" id="mgWho"></button></header>
    <nav class="mgsecs" id="mgSecs"></nav>

<dialog id="dlg">
  <h2>Take payment</h2>
  <div id="due" class="chg"></div>
  <div class="seg"><button data-m="Cash" class="on">Cash</button><button data-m="Card">Card</button></div>

    <input id="tender" type="number" min="0" step="0.01" inputmode="decimal" aria-label="Cash received">
    <div class="quick" id="quick"></div>

  </div>

</dialog>

<script>
const TAX=0.095, CUR="Rs ";
const CATS=[
 {id:"burgers",n:"Burgers",c:"#f0533b"},{id:"sides",n:"Sides",c:"#f59a2b"},
 {id:"drinks",n:"Drinks",c:"#1e7be0"},{id:"salads",n:"Salads",c:"#d1122f"},
 {id:"desserts",n:"Desserts",c:"#d02fb0"}];
let ITEMS=[
 ["Cheeseburger","burgers",11],["The Classic","burgers",10],["Mushroom Burger","burgers",10],["Double Bacon","burgers",13],["Citrus Bird","burgers",12],["Veggie Burger","burgers",10],
 ["French Fries","sides",4],["Onion Rings","sides",5],["Side Salad","sides",5],["Mac & Cheese","sides",6],["Sweet Potato Fries","sides",5],
 ["Lemonade","drinks",3.5],["Iced Tea","drinks",3],["Cola","drinks",2.5],["Craft Beer","drinks",7],["House Wine","drinks",8],
 ["Caesar Salad","salads",9],["Garden Salad","salads",8],["Chef Salad","salads",10],
 ["Brownie","desserts",5],["Cheesecake","desserts",6],["Ice Cream","desserts",4]
].map((r,i)=>({id:i,n:r[0],cat:r[1],p:r[2],st:{"Head Office":50},rec:[]}));
let DB={raws:[],grns:[],togs:[],tables:[1,2,3,4,5,6].map(n=>({name:"T"+n,seats:4})),holds:[],site:"Head Office",rc:{name:"My Store",addr:"Colombo, Sri Lanka",foot:"Thank you, come again!",w:80,tax:true,logo:"🍔"}};
try{const d=JSON.parse(localStorage.getItem("pos-db"));if(d){DB=Object.assign(DB,d);if(d.items)ITEMS=d.items}}catch(e){}
const persist=()=>{try{DB.items=ITEMS;localStorage.setItem("pos-db",JSON.stringify(DB))}catch(e){}};
const color=c=>CATS.find(x=>x.id===c).c;
const $=s=>document.querySelector(s);
const money=v=>CUR+v.toFixed(2);
var _an=true;let curTable=null,cart={},cat=null,view="menu",disc=false,dine=true,method="Cash",orders=[],seq=1;
try{orders=JSON.parse(localStorage.getItem("pos-orders")||"[]");seq=orders.length+1}catch(e){}
const save=()=>{try{localStorage.setItem("pos-orders",JSON.stringify(orders))}catch(e){}};

function totals(){
 let sub=0;for(const id in cart)sub+=ITEMS[id].p*cart[id];
 const d=disc?sub*0.1:0,tax=(sub-d)*TAX;
 return{sub,d,tax,total:sub-d+tax,count:Object.values(cart).reduce((a,b)=>a+b,0)};
}
function renderMain(){
 document.body.classList.toggle("mg",view==="manage");
 const b=view==="manage"?$("#mgBody"):$("#body");$("#title").textContent={menu:"Menu",orders:"Orders",manage:"Manage"}[view];
 $("#q").classList.toggle("hide",view!=="menu");
 ["Menu","Ord","Mng"].forEach((k,j)=>$("#n"+k).classList.toggle("on",view===["menu","orders","manage"][j]));
 if(view==="manage"){renderManage(b);return}
 if(view==="orders"){
  b.innerHTML=orders.length?orders.slice().reverse().map(o=>`<div class="ord" data-o="${o.no}"><div><b>#${o.no} · ${o.mode}${o.table?" · "+o.table:""}</b><b>${money(o.total)}</b></div><p>${o.time} · ${o.method} · ${o.items}</p></div>`).join(""):'<div class="empty">No completed orders yet. Finished sales show up here.</div>';
  return;
 }
 const s=$("#q").value.trim().toLowerCase();
 const list=ITEMS.filter(i=>(!cat||i.cat===cat)&&(!s||i.n.toLowerCase().includes(s)));
 b.innerHTML=`<div class="cats"><button class="cat ${cat?"":"on"}" style="background:#4b5563" data-c="">All</button>${CATS.map(c=>`<button class="cat ${cat===c.id?"on":""}" style="background:${c.c}" data-c="${c.id}">${c.n}<small>${ITEMS.filter(i=>i.cat===c.id).length} items</small></button>`).join("")}</div>
 <div class="items">${list.map((i,k)=>`<button class="item ${_an===false?"":"an"}" style="--c:${color(i.cat)};--i:${Math.min(k,14)}" data-i="${i.id}"><em class="qb${cart[i.id]?" on":""}">${cart[i.id]||""}</em><div class="pic">${i.n[0]}</div><b>${i.n}</b><span class="pr">${money(i.p)}</span><i class="plus" aria-hidden="true">+</i></button>`).join("")||'<div class="empty">No items match your search.</div>'}</div>`;
}
function renderTicket(){
 $("#tno").textContent="#"+seq;
 const ids=Object.keys(cart);
 $("#lines").innerHTML=ids.length?ids.map(id=>`<div class="line"><span class="n">${ITEMS[id].n}</span><div class="q"><button data-d="-1" data-id="${id}" aria-label="Remove one">−</button><span>${cart[id]}</span><button data-d="1" data-id="${id}" aria-label="Add one">+</button></div><b>${money(ITEMS[id].p*cart[id])}</b></div>`).join(""):'<div class="empty">Tap an item to start this check.</div>';
 const t=totals();
 $("#sum").innerHTML=`<div><span>Subtotal</span><span>${money(t.sub)}</span></div>${disc?`<div><span>Discount (10%)</span><span>−${money(t.d)}</span></div>`:""}<div><span>Tax</span><span>${money(t.tax)}</span></div><div class="t"><span>Total</span><span>${money(t.total)}</span></div>`;
 $("#pay").disabled=!t.count;$("#pay").textContent=t.count?"Pay "+money(t.total):"Pay";
 $("#disc").classList.toggle("on",disc);$("#dine").textContent=dine?"Dine in":"Takeaway";
}
const all=()=>{renderMain();renderTicket()};

document.addEventListener("click",e=>{
 const c=e.target.closest("[data-c]"),i=e.target.closest("[data-i]"),d=e.target.closest("[data-d]");
 if(c){cat=cat===c.dataset.c?null:c.dataset.c;renderMain()}
 if(i){cart[i.dataset.i]=(cart[i.dataset.i]||0)+1;renderTicket()}
 if(d){const id=d.dataset.id;cart[id]+=+d.dataset.d;if(cart[id]<1)delete cart[id];renderTicket()}
});
$("#q").oninput=renderMain;
$("#nMenu").onclick=()=>{view="menu";renderMain()};
$("#nOrd").onclick=()=>{view="orders";renderMain()};
$("#nMng").onclick=()=>{view="manage";renderMain()};
$("#clear").onclick=()=>{cart={};disc=false;renderTicket()};
$("#disc").onclick=()=>{disc=!disc;renderTicket()};
$("#dine").onclick=()=>{dine=!dine;renderTicket()};

const dlg=$("#dlg");
function calcChange(){
 const t=totals().total,v=parseFloat($("#tender").value)||0;
 $("#change").textContent=money(Math.max(0,v-t));
 $("#done").disabled=method==="Cash"&&v<t-0.005;
}
$("#pay").onclick=()=>{
 const t=totals().total;$("#due").textContent="Amount due: "+money(t);
 const r=Math.ceil(t);const opts=[t,r,r+ (5-r%5||5),Math.ceil(t/10)*10+10].filter((v,i,a)=>a.indexOf(v)===i);
 $("#quick").innerHTML=opts.map(v=>`<button class="ghost" data-q="${v}">${money(v)}</button>`).join("");
 $("#tender").value=t.toFixed(2);method="Cash";
 dlg.querySelectorAll(".seg button").forEach(b=>b.classList.toggle("on",b.dataset.m==="Cash"));
 $("#cashBox").classList.remove("hide");calcChange();dlg.showModal();
};
dlg.querySelectorAll(".seg button").forEach(b=>b.onclick=()=>{
 method=b.dataset.m;dlg.querySelectorAll(".seg button").forEach(x=>x.classList.toggle("on",x===b));
 $("#cashBox").classList.toggle("hide",method!=="Cash");calcChange();
});
$("#quick").onclick=e=>{const b=e.target.closest("[data-q]");if(b){$("#tender").value=(+b.dataset.q).toFixed(2);calcChange()}};
$("#tender").oninput=calcChange;
$("#cancel").onclick=()=>dlg.close();
$("#done").onclick=()=>{
 const t=totals();
 const lines=Object.keys(cart).map(id=>({n:ITEMS[id].n,q:cart[id],p:ITEMS[id].p})),o={no:seq,total:t.total,sub:t.sub,d:t.d,tax:t.tax,lines,method,mode:dine?"Dine in":"Takeaway",table:dine?curTable:null,day:new Date().toLocaleDateString("en-CA"),time:new Date().toLocaleTimeString([], {hour:"2-digit",minute:"2-digit"}),items:lines.map(l=>l.q+"× "+l.n).join(", ")};

rcp:()=>{const c=DB.rc;return `<form class="fm" id="rcf">${fld("Shop name",`<input name="name" value="${E(c.name)}">`)}${fld("Address",`<input name="addr" value="${E(c.addr)}">`)}${fld("Footer message",`<input name="foot" value="${E(c.foot)}">`)}${fld("Logo emoji",`<input name="logo" value="${E(c.logo)}" size="3">`)}${fld("Paper",`<select name="w"><option value="80"${c.w===80?" selected":""}>80 mm<option value="58"${c.w===58?" selected":""}>58 mm</select>`)}${fld("Show tax line",`<input name="tax" type="checkbox"${c.tax?" checked":""}>`)}</form><div id="prev">${receiptHTML(SAMPLE)}</div><p class="chg">Changes save automatically and apply to every receipt. Tap an order in Orders to reprint it.</p>`}

  else if(step==="done"){const s=sent.status,tx={new:["…","wait","Order "+sent.id+" sent","Waiting for the shop to accept it. Keep this page open."],accepted:["✓","","Order "+sent.id+" accepted","Your order is being prepared. Quote "+sent.id+" if you call us."],declined:["✕","no","Order "+sent.id+" declined","The shop couldn't take this order. Please call them or try again."]}[s];
   el.innerHTML=`<div class="cmw done"><div class="tick ${tx[1]}">${tx[0]}</div><h2>${tx[2]}</h2><p class="chg">${tx[3]}</p>${s!=="new"?'<button type="button" class="cmbar static" data-new="1">New order</button>':""}</div>`}
  else{const known=new Set(M.cats.map(c=>c.id)),groups=M.cats.map(c=>[c.n,M.items.filter(i=>i.cat===c.id)]).concat([["Other",M.items.filter(i=>!known.has(i.cat))]]).filter(g=>g[1].length);
   el.innerHTML=`<form id="cf" class="cmw" novalidate><h1 class="cmt">${E(M.name||"Menu")}</h1>${J(groups.map(g=>`<h3 class="cmg">${E(g[0])}</h3><div class="cml">${J(g[1].map(row))}</div>`))}`+
   (t.n?`<h3 class="cmg">Your details</h3><label>Name<input name="n" autocomplete="name" value="${E(fm.n)}">${er("n")}</label><label>Phone<input name="ph" type="tel" inputmode="tel" autocomplete="tel" value="${E(fm.ph)}">${er("ph")}</label><label>Address<textarea name="ad" rows="2" autocomplete="street-address">${E(fm.ad)}</textarea>${er("ad")}</label><label>Note (optional)<input name="note" value="${E(fm.note)}"></label><div class="sm">${J(t.l.map(i=>`<div><span>${i.q}× ${E(i.n)}</span><span>${money(i.p*i.q)}</span></div>`))}<div><span>Tax</span><span>${money(t.tax)}</span></div><div><b>Total</b><b>${money(t.total)}</b></div></div>${er("top")}<button class="cmbar static" type="submit">Place order · ${money(t.total)}</button>`:'<p class="chg">Tap Add on the items you want.</p>')+`</form>`}
  scrollTo(0,y)}
 el.addEventListener("click",e=>{const b=e.target.closest("button");if(!b)return;
  if(b.dataset.cq){const id=b.dataset.id;cc[id]=Math.max(0,Math.min(99,(cc[id]||0)+ +b.dataset.cq));if(!cc[id])delete cc[id];draw()}
  else if(b.dataset.new){clearInterval(tm);sent=null;step="menu";draw();scrollTo(0,0)}});
 el.addEventListener("input",e=>{if(e.target.name in fm)fm[e.target.name]=e.target.value});
 el.addEventListener("submit",async e=>{e.preventDefault();errs={};
  if(fm.n.trim().length<2)errs.n="Enter your name.";
  if(!PH.test(fm.ph.trim()))errs.ph="Enter a valid phone number, like 0771234567.";
  if(fm.ad.trim().length<5)errs.ad="Enter your address.";
  if(Object.keys(errs).length){draw();return}
  const btn=e.target.querySelector("button[type=submit]");if(btn)btn.disabled=true;
  try{const r=await inbox.add({items:cq().map(i=>({id:i.id,n:i.n,q:i.q,p:i.p})),cust:{n:fm.n.trim(),ph:fm.ph.trim(),ad:fm.ad.trim()},note:fm.note.trim()});
   sent={id:r.id,status:"new"};cc={};step="done";clearInterval(tm);tm=setInterval(chk,3000);draw();scrollTo(0,0)}
  catch(x){errs.top=x&&x.status===503?"The shop isn't taking online orders right now.":x&&x.status===400?"An item may have just sold out. Reload the page and try again.":"We couldn't send your order. Check your connection and try again.";draw()}});
 async function chk(){try{const s=SRV?await api("/orders/"+sent.id):(await inbox.list()).find(o=>o.id===sent.id);if(s&&s.status!==sent.status){sent.status=s.status;draw()}}catch(e){}}
 (async()=>{await ready;try{M=SRV?await api("/menu"):menuPayload()}catch(e){}draw()})()}
renderTicket();

</script>
<script>
/* ---- staff accounts & sign-in ---- */
DB.staff=(DB.staff&&DB.staff.length)?DB.staff:[{id:1,name:"Manager",pass:"1234",role:"manager"}];
let SESSION=null;
try{SESSION=JSON.parse(sessionStorage.getItem("pos-session")||"null")}catch(e){}
if(SESSION&&!DB.staff.some(s=>s.id===SESSION.id))SESSION=null;
const mgrCount=()=>DB.staff.filter(x=>x.role==="manager").length;

function loginDlg(err){
 let d=$$("login");if(!d){d=document.createElement("dialog");d.id="login";document.body.appendChild(d);d.addEventListener("cancel",e=>e.preventDefault())}
 d.innerHTML=`<div class="loginbox"><h2>Staff sign-in</h2><p class="chg">Enter your name and passcode to open the register.</p><form class="fm" id="lf">${inp("n","Name")}${inp("p","Passcode","password")}<div class="err">${err?E(err):""}</div><button>Sign in</button></form></div>`;
 if(!d.open)d.showModal();

  d.close();applySession()};
}
function applySession(){
 $("#who").textContent=SESSION.name+" · "+(SESSION.role==="manager"?"Manager":"Cashier")+" · Sign out";

}
if(!CM){
 if(SESSION)applySession();else loginDlg();
 $("#who").onclick=()=>{if(confirm("Sign out of the register?")){sessionStorage.removeItem("pos-session");location.reload()}};
 const _nMngClick=$("#nMng").onclick;
 $("#nMng").onclick=()=>{if(!SESSION||SESSION.role!=="manager"){toast("Manager sign-in required for Manage.");return}_nMngClick()};
 $("#topCust").onclick=()=>$("#custBtn").click();
}

/* ---- Settings: cashiers & managers (Manage only, so cashiers never reach this) ---- */
TABS.push(["stf","Settings"]);
PN.stf=()=>`<div class="card2"><b>Signed in as</b><p class="chg">${E(SESSION.name)} · ${SESSION.role==="manager"?"Manager":"Cashier"}</p></div>
<form class="fm" data-x="staff">${inp("n","Name")}${inp("p","Passcode","password")}${sel("r","Role",'<option value="cashier">Cashier — Menu and Orders only</option><option value="manager">Manager — full access</option>')}<button>Add staff</button></form>
<table><tr><th>Name<th>Role<th></tr>${J(DB.staff.map(s=>`<tr><td>${E(s.name)}</td><td>${s.role==="manager"?"Manager":"Cashier"}</td><td class="r"><button class="mini" data-do="se" data-n="${s.id}">Edit</button><button class="mini dg" data-do="sd" data-n="${s.id}">Delete</button></td></tr>`))}</table>`;
function staffDlg(id){const s=DB.staff.find(x=>x.id===id);
 pk(`<h2>Edit staff</h2><form class="fm" data-x="sedit" data-n="${id}">${inp("n","Name","text",`value="${E(s.name)}"`)}${inp("p","New passcode (leave blank to keep current)","password")}${sel("r","Role",`<option value="cashier"${s.role==="cashier"?" selected":""}>Cashier — Menu and Orders only</option><option value="manager"${s.role==="manager"?" selected":""}>Manager — full access</option>`)}<button>Save changes</button></form>`)}

/* ---- void a completed order (manager credentials required every time) ---- */
function openVoidDlg(no){pk(`<h2>Void order #${no}</h2><p class="chg">Only a manager can void a completed order. This restocks the items and reverses any loyalty points.</p><form class="fm" data-x="vconf" data-n="${no}">${inp("mn","Manager name")}${inp("mp","Manager passcode","password")}<button>Confirm void</button></form>`)}
function doVoid(no,by){const o=orders.find(x=>x.no===no);if(!o||o.voided)return;
 (o.lines||[]).forEach(l=>{const x=ITEMS.find(it=>it.n===l.n);if(!x)return;if(x.rec.length)x.rec.forEach(r=>{DB.raws[r.r].st[DB.site]=(DB.raws[r.r].st[DB.site]||0)+r.q*l.q});else x.st[DB.site]=(x.st[DB.site]||0)+l.q});
 if(o.cust){const c=DB.custs.find(x=>x.ph===o.cust.ph);if(c)c.pts+=(o.pu||0)-(o.pe||0)}
 o.voided=true;o.voidBy=by;o.voidAt=new Date().toLocaleString();save();msg="Order #"+no+" voided.";persist()}

/* void button intercepted in capture phase so it never also opens the receipt view */
document.addEventListener("click",e=>{const v=e.target.closest("[data-void]");if(v){e.stopPropagation();openVoidDlg(+v.dataset.void)}},true);

document.addEventListener("click",e=>{const b=e.target.closest("[data-do]");if(!b)return;const k=b.dataset.do,n=+b.dataset.n;
 if(k==="se")staffDlg(n);
 else if(k==="sd"){const s=DB.staff.find(x=>x.id===n);if(!s)return;
  if(s.role==="manager"&&mgrCount()<=1){toast("At least one manager is required.");return}
  if(confirm("Remove "+s.name+" from staff?")){DB.staff=DB.staff.filter(x=>x.id!==n);fin("Staff removed.")}}
 else if(k==="rmlogo"){DB.rc.logoImg="";persist();renderMain()}});

document.addEventListener("submit",e=>{const f=e.target,k=f.dataset.x;if(!k)return;
 if(!["staff","sedit","vconf"].includes(k))return;
 e.preventDefault();e.stopPropagation();
 const d=Object.fromEntries(new FormData(f)),n=+f.dataset.n;
 if(k==="staff"){if(!d.n.trim()||!d.p){bad(f,"p","Enter a name and a passcode.");return}
  DB.staff.push({id:Date.now(),name:d.n.trim(),pass:d.p,role:d.r});fin("Staff added.")}
 else if(k==="sedit"){const s=DB.staff.find(x=>x.id===n);
  if(s.role==="manager"&&d.r!=="manager"&&mgrCount()<=1){bad(f,"r","At least one manager is required.");return}
  s.name=d.n.trim();if(d.p)s.pass=d.p;s.role=d.r;fin("Staff updated.")}
 else if(k==="vconf"){const s=DB.staff.find(x=>x.role==="manager"&&x.name.toLowerCase()===d.mn.trim().toLowerCase()&&x.pass===d.mp);
  if(!s){bad(f,"mp","Incorrect manager name or passcode.");return}
  doVoid(n,s.name);closePk();renderMain()}},true);

/* ---- orders list: void button / voided tag ---- */
const _rm2=renderMain;
renderMain=()=>{_rm2();
 if(view==="orders")document.querySelectorAll(".ord[data-o]").forEach(el=>{const o=orders.find(x=>x.no==el.dataset.o);if(!o)return;
  if(o.voided){el.classList.add("voided");el.querySelector("p").append(" · Voided by "+o.voidBy)}
  else{const btn=document.createElement("button");btn.className="mini dg";btn.textContent="Void order";btn.setAttribute("data-void",o.no);el.appendChild(btn)}})};

/* ---- receipt logo image upload ---- */
const _rcp2=PN.rcp;
PN.rcp=()=>_rcp2()+`<div class="card2"><b>Receipt logo image</b><p class="chg">Upload a small image to print on receipts instead of the emoji logo.</p><input type="file" id="logoFile" accept="image/*">${DB.rc.logoImg?'<button type="button" class="mini dg" data-do="rmlogo" style="margin-left:8px">Remove uploaded logo</button>':""}</div>`;
document.addEventListener("change",e=>{if(e.target.id==="logoFile"&&e.target.files[0]){const r=new FileReader();r.onload=()=>{DB.rc.logoImg=r.result;persist();renderMain()};r.readAsDataURL(e.target.files[0])}});

/* ---- sales report & Excel export: exclude voided orders ---- */
PN.rpt=()=>{const today=new Date().toLocaleDateString("en-CA"),os=orders.filter(o=>!o.voided&&(rper==="all"||o.day===today)),by={};let sub=0,dis=0,tax=0,tot=0;
 os.forEach(o=>{sub+=o.sub||0;dis+=o.d||0;tax+=o.tax||0;tot+=o.total;(o.lines||[]).forEach(l=>{const it=ITEMS.find(x=>x.n===l.n),k=it?it.cat:"other",r=by[k]||(by[k]={q:0,v:0});r.q+=l.q;r.v+=l.q*l.p})});
 const max=Math.max(1,...Object.values(by).map(r=>r.v)),rows=Object.keys(by).sort((a,b)=>by[b].v-by[a].v).map(k=>{const c=CATS.find(x=>x.id===k);return `<tr><td>${c?c.n:"Other"}</td><td class="r">${by[k].q}</td><td class="r">${money(by[k].v)}</td><td><div class="bar"><i style="width:${by[k].v/max*100}%;background:${c?c.c:"#888"}"></i></div></td></tr>`});
 return `<div class="fm">${fld("Period",`<select id="per"><option value="today"${rper==="today"?" selected":""}>Today<option value="all"${rper==="all"?" selected":""}>All time</select>`)}<button type="button" data-do="xrpt">Download Excel report</button></div>${os.length?`<table><tr><th>Category<th class="r">Qty<th class="r">Sales<th></tr>${J(rows)}</table><table><tr><td>Orders</td><td class="r">${os.length}</td></tr><tr><td>Item sales</td><td class="r">${money(sub)}</td></tr><tr><td>Discounts</td><td class="r">−${money(dis)}</td></tr><tr><td>Tax</td><td class="r">${money(tax)}</td></tr><tr><td><b>Total collected</b></td><td class="r"><b>${money(tot)}</b></td></tr></table>`:'<p class="chg">No sales in this period yet.</p>'}${orders.some(o=>o.voided)?`<p class="chg">Voided orders are excluded from these totals.</p>`:""}`};
function exportReport(){if(noX())return;const today=new Date().toLocaleDateString("en-CA"),os=orders.filter(o=>!o.voided&&(rper==="all"||o.day===today)),by={},it={};
 const r2=v=>Math.round((v||0)*100)/100,sum=k=>r2(os.reduce((a,o)=>a+(o[k]||0),0));
 os.forEach(o=>(o.lines||[]).forEach(l=>{const x=ITEMS.find(k=>k.n===l.n),c=catName(x&&x.cat);(by[c]=by[c]||{q:0,v:0}).q+=l.q;by[c].v+=l.q*l.p;(it[l.n]=it[l.n]||{c,q:0,v:0}).q+=l.q;it[l.n].v+=l.q*l.p}));
 const wb=XLSX.utils.book_new(),add=(n,a)=>XLSX.utils.book_append_sheet(wb,XLSX.utils.aoa_to_sheet(a),n);
 add("Summary",[["Period",rper==="all"?"All time":today],["Orders",os.length],["Item sales",sum("sub")],["Discounts (incl. points)",sum("d")],["of which loyalty points",sum("r")],["Tax",sum("tax")],["Total collected",sum("total")]]);
 add("By category",[["Category","Qty","Sales"],...Object.entries(by).sort((a,b)=>b[1].v-a[1].v).map(([k,v])=>[k,v.q,r2(v.v)])]);
 add("Items sold",[["Item","Category","Qty","Sales"],...Object.entries(it).sort((a,b)=>b[1].v-a[1].v).map(([k,v])=>[k,v.c,v.q,r2(v.v)])]);
 add("Orders",[["Order","Date","Time","Type","Table","Payment","Customer","Phone","Items","Subtotal","Discount","Tax","Total"],...os.map(o=>[o.no,o.day,o.time,o.mode,o.table||"",o.method,o.cust?o.cust.n:"",o.cust?o.cust.ph:"",o.items,r2(o.sub),r2(o.d),r2(o.tax),r2(o.total)])]);
 XLSX.writeFile(wb,"sales-report-"+(rper==="all"?"all-time":today)+".xlsx")}

<script>
/* ---- Devices: customer display + kitchen printer ---- */
(function(){
 const D0={cd:{on:true,welcome:"Welcome! Your order will appear here.",thanks:"Thank you, come again!"},
  kp:{on:false,auto:true,name:"Kitchen",w:80,copies:1,cats:CATS.map(c=>c.id)}};
 DB.dev=DB.dev||{};DB.dev.cd=Object.assign({},D0.cd,DB.dev.cd);DB.dev.kp=Object.assign({},D0.kp,DB.dev.kp);
 const dev=DB.dev,who=()=>typeof SESSION!=="undefined"&&SESSION?SESSION.name:"";

 /* ticket buttons */
 const row=document.createElement("div");row.className="row";row.id="devRow";
 row.innerHTML='<button class="ghost" id="kitchen">Send to kitchen</button><button class="ghost" id="cdBtn">Customer display</button>';
 $$("hold").parentElement.after(row);

 /* ---------- kitchen printer ---------- */
 const cartSent=()=>{if(!Object.prototype.hasOwnProperty.call(cart,"__sent"))Object.defineProperty(cart,"__sent",{value:{},enumerable:false,writable:true});return cart.__sent};
 const catOf=n=>{const x=ITEMS.find(i=>i.n===n);return x?x.cat:null};
 const okCat=c=>!c||dev.kp.cats.includes(c);
 const pending=()=>{const s=cartSent();return Object.keys(cart).map(id=>({id,n:ITEMS[id].n,cat:ITEMS[id].cat,q:cart[id]-(s[id]||0)})).filter(l=>l.q>0&&okCat(l.cat))};
 const kHTML=(lines,o)=>{
  const k=dev.kp,w=k.w===58?"46mm":"70mm",now=new Date().toLocaleTimeString([],{hour:"2-digit",minute:"2-digit"});
  const one='<div class="t"><h1>'+E(k.name||"Kitchen")+'</h1>'+(o.extra?'<div class="ad">ADD-ON ORDER</div>':'')+'<div class="big">#'+E(o.no)+'</div><div class="m">'+E(o.mode||"")+(o.table?" · "+E(o.table):"")+'</div><div class="m">'+now+(o.by?" · "+E(o.by):"")+'</div><hr>'+lines.map(l=>'<div class="l"><b>'+l.q+'×</b> '+E(l.n)+'</div>').join("")+'<hr><div class="m">'+lines.reduce((a,l)=>a+l.q,0)+' item(s)</div></div>';
  return '<!doctype html><meta charset="utf-8"><title>Kitchen ticket</title><style>@page{margin:2mm}body{margin:0;width:'+w+';font:14px/1.3 Arial,Helvetica,sans-serif;color:#000}.t{page-break-after:always;padding:2mm 0}.t:last-child{page-break-after:auto}h1{font-size:16px;text-align:center;margin:0;text-transform:uppercase;letter-spacing:.08em}.big{font-size:34px;font-weight:900;text-align:center;line-height:1.1}.m{text-align:center;font-size:13px}.ad{text-align:center;font-weight:700;border:2px solid #000;margin:4px 0;padding:2px}.l{font-size:19px;padding:3px 0;border-bottom:1px dotted #777}hr{border:0;border-top:2px dashed #000;margin:6px 0}</style><body>'+Array(Math.max(1,dev.kp.copies|0)).fill(one).join("")+'</body>'};
 function printHTML(html){
  const f=document.createElement("iframe");f.style.cssText="position:fixed;right:0;bottom:0;width:0;height:0;border:0";document.body.appendChild(f);
  const d=f.contentWindow.document;d.open();d.write(html);d.close();
  setTimeout(()=>{try{f.contentWindow.focus();f.contentWindow.print()}catch(e){toast("Could not open the print dialog.")}setTimeout(()=>f.remove(),3000)},250)}
 function sendKitchen(lines,o){if(!lines.length)return false;printHTML(kHTML(lines,o));return true}
 $$("kitchen").onclick=()=>{
  const l=pending();if(!l.length){toast("Nothing new to send to the kitchen.");return}
  const s=cartSent(),extra=Object.keys(s).length>0;
  sendKitchen(l,{no:seq,mode:dine?"Dine in":"Takeaway",table:dine?curTable:null,extra,by:who()});
  l.forEach(x=>s[x.id]=cart[x.id]);renderTicket();toast("Sent to kitchen printer")};

 /* fires for every completed order (POS payment and accepted QR orders) */
 const _push=orders.push.bind(orders);
 orders.push=function(...a){const r=_push(...a);a.forEach(o=>{try{onOrder(o)}catch(e){}});return r};
 function onOrder(o){
  cdPost({t:"thanks",total:o.total,msg:dev.cd.thanks,cur:CUR});
  if(!dev.kp.on||!dev.kp.auto)return;
  if(String(o.mode||"").startsWith("QR")){
   sendKitchen((o.lines||[]).map(l=>({n:l.n,q:l.q,cat:catOf(l.n)})).filter(l=>okCat(l.cat)),{no:o.no,mode:o.mode,table:o.table,by:""});return}
  const s=cartSent(),extra=Object.keys(s).length>0,l=pending();
  sendKitchen(l,{no:o.no,mode:o.mode,table:o.table,extra,by:who()});l.forEach(x=>s[x.id]=cart[x.id])}

 /* ---------- customer display ---------- */
 const CDHTML=String.raw`<!doctype html><html><head><meta charset="utf-8"><title>Customer display</title><meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}html,body{height:100%;margin:0}
body{font-family:"Roboto","Segoe UI",system-ui,sans-serif;background:#0d1514;color:#eaf2f0;display:grid;grid-template-columns:36% 1fr;overflow:hidden}
.l{background:linear-gradient(160deg,#0b7a6c,#095c52);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:32px;gap:14px}

.r{display:flex;flex-direction:column;padding:28px 34px;min-height:0}
#idle{flex:1;display:flex;align-items:center;justify-content:center;font-size:clamp(20px,3vw,38px);color:#8fa5a1;text-align:center}
#order{flex:1;flex-direction:column;min-height:0;display:none}
h2{margin:0 0 12px;font-size:clamp(16px,1.8vw,22px);font-weight:500;color:#8fa5a1;letter-spacing:.12em;text-transform:uppercase}
#lines{flex:1;overflow:auto}
.row{display:flex;gap:16px;align-items:baseline;padding:14px 4px;border-bottom:1px solid #24332f;font-size:clamp(18px,2.4vw,32px)}
.row.n{animation:in .3s cubic-bezier(.2,.8,.2,1)}
.row .q{min-width:2.2em;color:#f0a23b;font-weight:700}.row .nm{flex:1}.row .am{font-weight:500}
.sm{padding-top:14px;display:grid;gap:6px;font-size:clamp(15px,1.8vw,22px);color:#8fa5a1}

  const r=new FileReader();

   im.onload=()=>{const S=240,c=document.createElement("canvas");c.width=c.height=S;const g=c.getContext("2d");
    g.fillStyle="#fff";g.fillRect(0,0,S,S);

    g.drawImage(im,sx,sy,m,m,0,0,S,S);res(c.toDataURL("image/jpeg",.8))};
   im.src=r.result};
  r.readAsDataURL(file)});

 /* Add-product form: image field */

 PN.prod=()=>_prod().replace('<button>Add product</button>',

<script>
/* action buttons as icon toolbar at the top of the ticket */
(function(){
 const ids=["custBtn","tbl","dine","delv","knote","disc","redBtn","hold","held"],bar=document.createElement("div");bar.className="tools";bar.id="tools";
 ids.forEach(id=>{const b=document.getElementById(id);if(b)bar.appendChild(b)});

 const dec=()=>{ids.forEach(id=>{const b=document.getElementById(id);if(!b)return;const t=b.textContent.trim();b.title=t;b.setAttribute("aria-label",t)});

  g("dine").dataset.mode=/take/i.test(g("dine").textContent)?"take":"dine";

 const _r=renderTicket;renderTicket=()=>{_r();dec()};renderTicket();
})();
